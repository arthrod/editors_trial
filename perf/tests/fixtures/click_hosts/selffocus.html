<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>c07 self-focus host</title>
<style>
  body { margin: 0; background: #fff; min-height: 1400px; }
  #doc {
    contenteditable: true;
    width: 420px;
    margin: 60px auto;
    font: 16px/24px Georgia, serif;
    color: #111;
    outline: none;
    white-space: pre-wrap;
  }
  #doc p { margin: 0 0 12px 0; }
  #doc:focus { outline: none; }
</style>
</head>
<body>
<div id="doc" contenteditable="true"><p>fixture line one alpha bravo charlie</p><p>fixture line two delta echo foxtrot</p><p>fixture line three golf hotel india</p><p>fixture line four juliet kilo lima</p><p>fixture line five mike november oscar</p></div>
<script>
// The editor's own load behaviour, not harness input (r3c07c): like
// GenOffice's autofocus or eigenpal's restored selection, this host plants a
// collapsed selection inside the editable and focuses it on every load.
// The caret sits at document start, far from the ink-centred click boxes.
const doc = document.getElementById('doc');
doc.focus();
const first = doc.querySelector('p');
const sel = window.getSelection();
sel.collapse(first.firstChild, 0);
</script>
</body>
</html>
