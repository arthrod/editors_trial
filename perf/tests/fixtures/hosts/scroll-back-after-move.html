<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>review: Enter moves the anchor, then scrolls it back before the after read</title>
    <style>
      body { margin: 0; background: #fff; color: #111; font: 16px/28px sans-serif; }
      .doc-paragraph { display: block; margin: 0 0 8px; min-height: 1.2em; }
      #spacer { height: 3000px; }
    </style>
  </head>
  <body>
    <div class="doc-paragraph" id="caret" contenteditable="true">Alpha body paragraph here</div>
    <div class="doc-paragraph" id="anchor">Beta anchor paragraph stays</div>
    <div class="doc-paragraph" id="tail">Gamma tail paragraph after</div>
    <div id="spacer"></div>
    <script>
      // Enter inserts a line above the anchor (+60 px, recorded), then the
      // host scrolls down to compensate: every later top read is back near
      // the baseline. A real in-window move is on tape; the stale-baseline
      // second clause in `moved` vetoes it anyway.
      var moved = false;
      document.addEventListener('keydown', function (event) {
        if (event.key === 'x' || event.key === 'X') {
          event.preventDefault();
          document.getElementById('caret').textContent = 'xAlpha body paragraph here';
          return;
        }
        if (event.key !== 'Enter') return;
        event.preventDefault();
        window.__enterAt = performance.now();
        if (!moved) {
          moved = true;
          document.getElementById('anchor').style.marginTop = '60px';
          window.__movedAt = performance.now();
          setTimeout(function () { window.scrollTo(0, 60); }, 120);
        }
      }, true);
    </script>
  </body>
</html>
