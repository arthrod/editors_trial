<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>B5 fake host: scroller first, late content after a static shell</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #ffffff;
        color: #111111;
        font: 14px/1.5 monospace;
      }
      #doc {
        box-sizing: border-box;
        height: 100vh;
        overflow-y: auto;
        padding: 12px;
      }
      p {
        margin: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <!-- A scroller exists immediately (the partial document). The DOM then
         stays static for `shell` ms (default 5 s, past the old 4 s quiet
         exit). Only then does the late sentinel arrive and the usable flag
         become true. A probe that returns on the first scroller, or on 4 s
         of quiet, measures without LATE_CHUNK_SENTINEL. -->
    <div id="doc"></div>
    <script>
      window.__docxReady = true;
      window.__docxUsable = false;
      var doc = document.getElementById('doc');
      for (var i = 0; i < 80; i++) {
        var paragraph = document.createElement('p');
        paragraph.textContent =
          'partial mount paragraph ' + i + ' alpha beta gamma delta epsilon zeta';
        doc.appendChild(paragraph);
      }
      var shellMs = Number(new URLSearchParams(location.search).get('shell') || '5000');
      setTimeout(function () {
        var sentinel = document.createElement('p');
        sentinel.id = 'late-sentinel';
        sentinel.textContent =
          'LATE_CHUNK_SENTINEL finishes the mounted document with enough characters';
        doc.insertBefore(sentinel, doc.firstChild);
        window.__docxUsable = true;
      }, shellMs);
    </script>
  </body>
</html>
