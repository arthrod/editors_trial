<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>B5 fake host: ready signal before the document mounts</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #ffffff;
        color: #111111;
        font: 14px/1.5 monospace;
      }
      #doc {
        box-sizing: border-box;
        height: 100vh;
        overflow-y: auto;
        padding: 12px;
      }
      p {
        margin: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <!-- The ready flag is true at once, like SuperDoc's loading shell: the
         document then mounts progressively over the next seconds. A scroll
         probe that scans on the ready signal alone sees an empty page. -->
    <div id="doc"><p>Loading document</p></div>
    <script src="/corpus.js"></script>
    <script>
      window.__docxReady = true;
      window.__b5.paragraphs().then(function (all) {
        const doc = document.getElementById('doc');
        doc.textContent = '';
        const chunks = 6;
        const size = Math.ceil(all.length / chunks);
        let at = 0;
        const mount = function () {
          const part = all.slice(at, at + size);
          for (const text of part) {
            const paragraph = document.createElement('p');
            paragraph.textContent = text;
            doc.appendChild(paragraph);
          }
          at += size;
          if (at < all.length) setTimeout(mount, 700);
        };
        setTimeout(mount, 2500);
      });
    </script>
  </body>
</html>
