<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>B5 fake host: the content moves on a later frame than the scroll</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #ffffff;
        color: #111111;
        font: 14px/1.5 monospace;
      }
      /* The content's containing block is #outer, outside the scroller: a
         scroll of #doc leaves it in place. The page moves it itself, two
         frames after the scroll event. The striped spacer is in the scroller's
         flow, so the first frame after the scroll does change. */
      #outer {
        position: relative;
        height: 100vh;
      }
      #doc {
        height: 100vh;
        overflow-y: auto;
      }
      #spacer {
        height: 3000px;
        margin-left: 50%;
        background: repeating-linear-gradient(#000 0 10px, #fff 10px 20px);
      }
      #content {
        position: absolute;
        top: 0;
        left: 0;
        width: 48%;
      }
      p {
        margin: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <div id="outer">
      <div id="doc"><div id="spacer"></div><div id="content"></div></div>
    </div>
    <script src="/corpus.js"></script>
    <script>
      var doc = document.getElementById("doc");
      var content = document.getElementById("content");
      doc.addEventListener("scroll", function () {
        var top = doc.scrollTop;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            content.style.top = -top + "px";
          });
        });
      });
      window.__b5.render(content).catch(function (error) {
        window.__b5Error = String(error);
        window.__docxReady = true;
      });
    </script>
  </body>
</html>
