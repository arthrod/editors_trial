<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>B5 fake host: a caret inside an open shadow root</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #ffffff;
        color: #111111;
        font: 14px/1.5 monospace;
      }
      #host {
        height: 100vh;
      }
      p {
        margin: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <!--
      The document lives in an OPEN shadow root, next to an editable that has a
      caret. The caret mask (`page.addStyleTag`) writes a *document*
      stylesheet, and a document stylesheet does not match elements inside a
      shadow root: the caret keeps blinking inside the shadow, and its damage
      is inside the region the witness watches.
    -->
    <div id="host"></div>
    <script src="/corpus.js"></script>
    <script>
      (function () {
        var host = document.getElementById('host');
        var root = host.attachShadow({ mode: 'open' });
        var style = document.createElement('style');
        style.textContent =
          '#doc { box-sizing: border-box; height: 60vh; overflow-y: auto; padding: 12px; }' +
          '#editable { min-height: 20px; border: 1px solid #cccccc; caret-color: #000000; }' +
          'p { margin: 0 0 8px; }';
        root.appendChild(style);
        var editable = document.createElement('div');
        editable.id = 'editable';
        editable.setAttribute('contenteditable', 'true');
        editable.textContent = 'editable line';
        root.appendChild(editable);
        var doc = document.createElement('div');
        doc.id = 'doc';
        root.appendChild(doc);
        window.__b5.render(doc).catch(function (error) {
          window.__b5Error = String(error);
          window.__docxReady = true;
        });
      })();
    </script>
  </body>
</html>
