<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>review: anchor drifts between census and arm; Enter moves nothing</title>
    <style>
      body { margin: 0; background: #fff; color: #111; font: 16px/28px sans-serif; }
      .doc-paragraph { display: block; margin: 0 0 8px; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <div class="doc-paragraph" id="caret" contenteditable="true">Alpha body paragraph here</div>
    <div class="doc-paragraph" id="anchor">Beta anchor paragraph stays</div>
    <div class="doc-paragraph" id="tail">Gamma tail paragraph after</div>
    <script>
      // gatherReflowBefore stores the census top and sets __c12BeforeSnapshot.
      // The arm re-read happens a task later (a separate page.evaluate). Move
      // the anchor +30 px the moment the snapshot appears: the drift lands
      // between the two reads, so the armed baseline already holds the moved
      // top -- exactly the SuperDoc prose signature (before 285 -> after 316,
      // no recorded frame).
      var drifted = false;
      var timer = setInterval(function () {
        if (!drifted && window.__c12BeforeSnapshot) {
          drifted = true;
          clearInterval(timer);
          document.getElementById('anchor').style.marginTop = '30px';
          window.__driftAt = performance.now();
        }
      }, 0);
      document.addEventListener('keydown', function (event) {
        if (event.key === 'x' || event.key === 'X') {
          event.preventDefault();
          document.getElementById('caret').textContent = 'xAlpha body paragraph here';
          return;
        }
        if (event.key !== 'Enter') return;
        event.preventDefault();
        window.__enterAt = performance.now();
      }, true);
    </script>
  </body>
</html>
