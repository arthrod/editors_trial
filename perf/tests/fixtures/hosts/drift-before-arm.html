<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>review: anchor drifts between census and arm; Enter moves nothing</title>
    <style>
      body { margin: 0; background: #fff; color: #111; font: 16px/28px sans-serif; }
      .doc-paragraph { display: block; margin: 0 0 8px; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <div class="doc-paragraph" id="caret" contenteditable="true">Alpha body paragraph here</div>
    <div class="doc-paragraph" id="anchor">Beta anchor paragraph stays</div>
    <div class="doc-paragraph" id="tail">Gamma tail paragraph after</div>
    <script>
      // gatherReflowBefore stores the census top, then assigns
      // __c12BeforeSnapshot, then returns that stored top. The arm re-read
      // is a later page.evaluate. A timer can lose that gap, so the drift
      // is the snapshot assignment itself: the returned census number stays
      // the pre-drift top, and the arm re-read sees the margin.
      Object.defineProperty(window, '__c12BeforeSnapshot', {
        configurable: true,
        set: function (value) {
          var anchor = document.getElementById('anchor');
          anchor.style.marginTop = '30px';
          anchor.getBoundingClientRect();
          window.__driftAt = performance.now();
          Object.defineProperty(window, '__c12BeforeSnapshot', {
            configurable: true,
            writable: true,
            value: value,
          });
        },
        get: function () { return undefined; },
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'x' || event.key === 'X') {
          event.preventDefault();
          document.getElementById('caret').textContent = 'xAlpha body paragraph here';
          return;
        }
        if (event.key !== 'Enter') return;
        event.preventDefault();
        window.__enterAt = performance.now();
      }, true);
    </script>
  </body>
</html>
