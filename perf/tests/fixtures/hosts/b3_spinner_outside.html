<!doctype html>
<html><body style="margin:0">
<div id="toolbar" style="height:48px;background:#eee;display:flex;align-items:center;padding:0 12px">
  <div id="spinner" style="width:32px;height:32px;border:4px solid #ccc;border-top-color:#333;border-radius:50%;animation:spin 0.8s linear infinite"></div>
  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</div>
<canvas class="doc-paragraph" width="600" height="400" style="display:block"></canvas>
<script>
var c = document.querySelector('canvas'), g = c.getContext('2d');
g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
setTimeout(function(){
  // The new load contract requires 500ms without any screencast frame.
  // Leave a compositor opportunity after ink; stopping in the same callback
  // can suppress the final screencast frame even though a screenshot sees it.
  setTimeout(() => document.getElementById('spinner').style.animation = 'none', 400);
  g.fillStyle = '#111';
  g.fillRect(40, 40, 320, 200);
}, 1200);
</script></body></html>
