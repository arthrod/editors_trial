<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>the block box corner is the next paragraph; the first glyph is not</title>
    <style>
      body { margin: 0; background: #fff; color: #111; font: 16px/28px sans-serif; }
      .doc-paragraph { position: absolute; }
      /* The caret block is tall. Its top-left, and the point the old click
         used (left + 1, vertical midpoint), belong to the next paragraph.
         The caret paragraph's own first glyph sits to the right of that cover. */
      #caret { left: 24px; top: 20px; width: 520px; height: 80px; z-index: 1; }
      #caret .glyph { position: absolute; left: 160px; top: 40px; }
      #anchor { left: 24px; top: 20px; width: 96px; height: 80px; z-index: 2; overflow: hidden; }
      #tail { left: 24px; top: 160px; width: 520px; height: 28px; }
    </style>
  </head>
  <body>
    <div class="doc-paragraph" id="caret" contenteditable="true"><span class="glyph">Alpha body paragraph here</span></div>
    <div class="doc-paragraph" id="anchor" contenteditable="true">Beta anchor paragraph stays</div>
    <div class="doc-paragraph" id="tail">Gamma tail paragraph after</div>
    <script>
      document.addEventListener('keydown', function (event) {
        if (event.key === 'x' || event.key === 'X') event.preventDefault();
        if (event.key !== 'Enter') return;
        event.preventDefault();
        document.getElementById('anchor').style.top = '480px';
        setTimeout(function () {
          var glyph = document.querySelector('#caret .glyph');
          if (glyph) glyph.textContent = 'xAlpha body paragraph here';
        }, 1600);
      }, true);
    </script>
  </body>
</html>
