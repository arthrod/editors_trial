<!doctype html>
<html><body style="margin:0">
<div class="doc-paragraph" id="region" style="width:400px;height:300px;background:#ffffff;position:relative">
  <canvas id="gl" width="400" height="300" style="width:100%;height:100%;display:block"></canvas>
</div>
<script>
var c = document.getElementById('gl');
var g = c.getContext('webgl') || c.getContext('experimental-webgl');
if (g) {
  g.clearColor(0.08, 0.08, 0.08, 1);
  g.clear(g.COLOR_BUFFER_BIT);
}
// The region is the host div; compositor paints WebGL inside it. Headless CDP
// may not diff the GL buffer, so the fixture also shifts the div background to
// prove screencast_ink (production WordCraft uses the canvas rect only).
setTimeout(function () {
  document.getElementById('region').style.background = '#223344';
}, 500);
</script></body></html>
