<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>review: the anchor moves BEFORE Enter; Enter itself moves nothing</title>
    <style>
      body { margin: 0; background: #fff; color: #111; font: 16px/28px sans-serif; }
      .doc-paragraph { display: block; margin: 0 0 8px; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <div class="doc-paragraph" id="caret" contenteditable="true">Alpha body paragraph here</div>
    <div class="doc-paragraph" id="anchor">Beta anchor paragraph stays</div>
    <div class="doc-paragraph" id="tail">Gamma tail paragraph after</div>
    <script>
      // A rAF watcher registered at load runs BEFORE the probe's recorder rAF
      // (registration order), so the move is applied and recorded on the very
      // first frame after the recorder arms -- before the Enter keydown.
      var moved = false;
      var watch = function () {
        if (!moved && window.__c12FrameLogActive === true) {
          moved = true;
          document.getElementById('anchor').style.marginTop = '420px';
          window.__movedAt = performance.now();
        }
        requestAnimationFrame(watch);
      };
      requestAnimationFrame(watch);
      document.addEventListener('keydown', function (event) {
        if (event.key === 'x' || event.key === 'X') {
          event.preventDefault();
          document.getElementById('caret').textContent = 'xAlpha body paragraph here';
          return;
        }
        if (event.key !== 'Enter') return;
        event.preventDefault();
        window.__enterAt = performance.now();
      }, true);
    </script>
  </body>
</html>
