<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>c185 canvas cleared at the flag, drawn later</title>
  </head>
  <body>
    <canvas class="doc-paragraph" width="800" height="600"></canvas>
    <script>
      // Like canvas-editor at 5,000 words (#185 review): the empty page shows
      // margin marks, the import flag flips while the page canvas is cleared,
      // and the document is drawn a little later (a lazy, observer-driven render).
      var canvas = document.querySelector('canvas');
      var g = canvas.getContext('2d');
      g.fillStyle = 'white';
      g.fillRect(0, 0, canvas.width, canvas.height);
      g.strokeStyle = '#c0c0c0';
      g.beginPath();
      g.moveTo(60, 40); g.lineTo(60, 60); g.lineTo(40, 60);
      g.stroke();
      setTimeout(function () {
        g.clearRect(0, 0, canvas.width, canvas.height);
        window.__DOCX_IMPORTED__ = true;
      }, 300);
      setTimeout(function () {
        g.fillStyle = 'white';
        g.fillRect(0, 0, canvas.width, canvas.height);
        g.fillStyle = 'black';
        g.font = '24px serif';
        g.fillText('Actual document text', 80, 100);
      }, 700);
    </script>
  </body>
</html>
