<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Folio repaints the same anchor block after the move frame</title>
    <style>
      body { margin: 0; background: #fff; color: #111; font: 16px/28px sans-serif; }
      .doc-paragraph { position: absolute; left: 24px; width: 520px; height: 28px; }
    </style>
  </head>
  <body>
    <div class="doc-paragraph" id="caret" contenteditable="true" data-block-id="block-7" data-para-id="CARET01" style="top:20px">Alpha body paragraph here</div>
    <div
      class="doc-paragraph"
      id="anchor"
      data-block-id="block-8"
      data-para-id="7A07F1B3"
      data-pm-start="208"
      data-pm-end="260"
      data-from-line="0"
      data-to-line="1"
      style="top:60px"
    >Beta anchor paragraph stays</div>
    <div class="doc-paragraph" id="tail" data-block-id="block-9" data-para-id="TAIL01" style="top:100px">Gamma tail paragraph after</div>
    <script>
      document.addEventListener('keydown', function (event) {
        if (event.key === 'x' || event.key === 'X') event.preventDefault();
        if (event.key !== 'Enter') return;
        event.preventDefault();
        document.getElementById('caret').remove();
        document.getElementById('anchor').remove();
        document.getElementById('tail').remove();
        function mk(id, top, text, blockId, paraId, pmStart, pmEnd) {
          var el = document.createElement('div');
          el.className = 'doc-paragraph';
          el.id = id;
          el.setAttribute('data-block-id', blockId);
          el.setAttribute('data-para-id', paraId);
          if (pmStart !== undefined) {
            el.setAttribute('data-pm-start', String(pmStart));
            el.setAttribute('data-pm-end', String(pmEnd));
            el.setAttribute('data-from-line', '0');
            el.setAttribute('data-to-line', '1');
          }
          el.style.top = top + 'px';
          el.textContent = text;
          document.body.appendChild(el);
          return el;
        }
        mk('caret', 20, 'Alpha body paragraph here', 'block-7', 'CARET01');
        mk('anchor', 480, 'Beta anchor paragraph stays', 'block-8', '7A07F1B3', 208, 260);
        mk('tail', 520, 'Gamma tail paragraph after', 'block-9', 'TAIL01');
        window.__movedAt = performance.now();
        // The move frame can record the node at 480. Folio then repaints that
        // same paragraph: a new node, same block id and paragraph id, the
        // ProseMirror range shifted by the Enter, the old node disconnected.
        setTimeout(function () {
          var old = document.getElementById('anchor');
          if (!old) return;
          var neu = mk('anchor', 480, 'Beta anchor paragraph stays', 'block-8', '7A07F1B3', 209, 261);
          old.replaceWith(neu);
          window.__replacedAgainAt = performance.now();
        }, 500);
        setTimeout(function () {
          document.getElementById('caret').textContent = 'xAlpha body paragraph here';
          window.__textAt = performance.now();
        }, 1200);
      }, true);
    </script>
  </body>
</html>
