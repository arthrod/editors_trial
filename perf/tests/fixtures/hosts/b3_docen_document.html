<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; min-height: 100%; }
  docen-document { display: block; min-height: 900px; }
</style>
<docen-document id="host" data-ready="1"></docen-document>
<script>
  const host = document.querySelector('#host');
  const shadow = host.attachShadow({ mode: 'open' });
  shadow.innerHTML = `
    <style>.canvas-pages > div { width: 636px; height: 800px; } canvas { width: 636px; height: 800px; background: white; }</style>
    <div class="canvas-pages"><div><canvas width="636" height="800"></canvas></div></div>`;
  const context = shadow.querySelector('canvas').getContext('2d');
  context.fillStyle = 'black';
  context.fillRect(20, 20, 200, 40);
  window.__DOCEN__ = {
    editor: {
      state: {
        doc: {
          content: { size: 41 },
          textBetween() { return 'REAL DOCUMENT CONTENT complete model text'; },
        },
      },
    },
  };
  window.__DOCEN_READY__ = true;
</script>
