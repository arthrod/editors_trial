<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>stale orphan keeps the anchor text</title>
    <style>
      body { margin: 0; background: #fff; color: #111; font: 16px/28px sans-serif; }
      .doc-paragraph, .orphaned-block { position: absolute; left: 24px; width: 520px; height: 28px; }
      #caret { top: 20px; }
      #anchor { top: 60px; }
      #tail { top: 100px; }
      #anchor-new { top: 60px; }
    </style>
  </head>
  <body>
    <div class="doc-paragraph" id="caret" contenteditable="true">Alpha body paragraph here</div>
    <div class="doc-paragraph" id="anchor">Beta anchor paragraph stays</div>
    <div class="doc-paragraph" id="tail">Gamma tail paragraph after</div>
    <script>
      document.addEventListener('keydown', function (event) {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        var caret = document.getElementById('caret');
        var anchor = document.getElementById('anchor');
        caret.textContent = 'xAlpha body paragraph here';
        anchor.className = 'orphaned-block';
        anchor.style.top = '700px';
        var neu = document.createElement('div');
        neu.className = 'doc-paragraph';
        neu.id = 'anchor-new';
        neu.textContent = 'Beta anchor paragraph stays';
        caret.after(neu);
        caret.removeAttribute('contenteditable');
      }, true);
      document.addEventListener('keydown', function (event) {
        if (event.key === 'x' || event.key === 'X') event.preventDefault();
      }, true);
    </script>
  </body>
</html>
