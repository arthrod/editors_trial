<!doctype html><meta charset="utf-8"><title>B2 input fixture</title>
<div class="status-ok">ready</div><div contenteditable="true" style="font:32px monospace;min-height:100px">fixture</div>
<script>
const delay = Number(new URLSearchParams(location.search).get('delay') || 0);
document.addEventListener('keydown', e => {
 if(e.key !== 'x') return;
 e.preventDefault();
 const paint = () => document.querySelector('[contenteditable]').append('x');
 if(delay) setTimeout(paint, delay); else paint();
});
</script>
