<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>b4 deferred-task host</title>
  </head>
  <body>
    <div id="ready" class="status-ok">ready</div>
    <div id="doc" contenteditable="true" style="white-space: pre-wrap">fixture line one
fixture line two
</div>
    <script>
      // #205: long tasks after ready are deferred work. They repeat until 6 s of page
      // time, closer together than C04's quiet window, so some always follow ready
      // (the harness sees ready about 2 s in).
      const stopAt = 6000;
      const tick = () => {
        const until = performance.now() + 80;
        while (performance.now() < until) {}
        if (performance.now() < stopAt) setTimeout(tick, 100);
      };
      addEventListener('load', () => setTimeout(tick, 100));
    </script>
  </body>
</html>
