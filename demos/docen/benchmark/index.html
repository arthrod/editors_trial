<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Docen — Document Editor</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f5f5f5;
      }

      body {
        position: relative;
      }

      docen-document {
        display: flex;
        width: 100%;
        height: 100%;
      }

      .download-button {
        position: fixed;
        z-index: 1000;
        top: 8px;
        right: 12px;
        min-height: 32px;
        padding: 5px 12px;
        border: 1px solid #d1d1d1;
        border-radius: 4px;
        background: #ffffff;
        color: #242424;
        box-shadow: 0 1px 3px rgb(0 0 0 / 18%);
        font: 600 13px/20px "Segoe UI", system-ui, sans-serif;
        cursor: pointer;
      }

      .download-button:hover {
        background: #f3f3f3;
      }

      .download-button:focus-visible {
        outline: 2px solid #0f6cbd;
        outline-offset: 2px;
      }

      .download-button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .status {
        position: fixed;
        z-index: 1001;
        right: 12px;
        bottom: 12px;
        max-width: min(420px, calc(100vw - 24px));
        padding: 8px 12px;
        border-radius: 4px;
        background: #fff4ce;
        color: #3b3b3b;
        box-shadow: 0 2px 8px rgb(0 0 0 / 20%);
        font-size: 13px;
      }

      @media (max-width: 480px) {
        .download-button {
          top: 6px;
          right: 8px;
          padding-inline: 10px;
        }
      }
    </style>
  </head>
  <body>
    <button id="download" class="download-button" type="button" disabled>Download .docx</button>
    <output id="status" class="status" role="status" hidden></output>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
