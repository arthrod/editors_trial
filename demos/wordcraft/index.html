<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>WordCraft</title>
  <link data-trunk rel="icon" href="../../assets/app-icon/wordcraft.ico" />
  <link data-trunk rel="rust" data-bin="wordcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    /* The page's own strip on top holds the Download button; the editor fills the rest, so the
       button covers none of the editor's controls. */
    #wordcraft_canvas { position: absolute; top: 36px; left: 0; right: 0; bottom: 0; width: 100%; height: calc(100% - 36px); display: block; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
    /* The page's own small toolbar: the editor fills the viewport, this floats above it. */
    #demo_toolbar { position: absolute; top: 0; left: 0; right: 0; height: 36px; z-index: 10; display: flex; align-items: center;
      justify-content: flex-end; padding: 0 8px; box-sizing: border-box; background: #1f1f1f; border-bottom: 1px solid #333; }
    #download-docx { font: 13px system-ui, sans-serif; color: #1a1a1a; background: #ffffff; border: 1px solid #b4b4b4;
      border-radius: 6px; padding: 4px 11px; cursor: pointer; }
    #download-docx:hover { background: #f3f3f3; }
    #download-docx:active { background: #e4e4e4; }
    #download-docx[disabled] { opacity: .55; cursor: default; }
  </style>
</head>
<body>
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading">Loading WordCraft&hellip;</div>
  <div id="demo_toolbar">
    <button id="download-docx" type="button" disabled>Download .docx</button>
  </div>
  <script>
    // The button asks the editor (the wasm app) to save the open document: the editor's own
    // writer makes the .docx and the browser downloads it.
    (function () {
      var button = document.getElementById('download-docx');
      var tries = 0;
      var timer = setInterval(function () {
        if (window.wordcraftDemo) {
          // The open document's text, as the editor reports it (it answers on its next frame).
          window.__demoText = function () {
            window.wordcraftDemo.requestState();
            try { return JSON.parse(window.wordcraftDemo.state()).text || ''; } catch (e) { return ''; }
          };
          button.disabled = false;
          clearInterval(timer);
        } else if (++tries > 1200) {
          clearInterval(timer);
        }
      }, 50);
      button.addEventListener('click', function () {
        if (window.wordcraftDemo) { window.wordcraftDemo.downloadDocx(); }
      });
    })();
  </script>
</body>
</html>
