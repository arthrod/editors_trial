<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>office-open — browser perf host (@office-open/docx parseDocument())</title>
    <style>
      * { box-sizing: border-box; }
      /* The root stays the page scroller (so full-page screenshots still work)
         while advertising the scroll container the C10 probe looks for. */
      html { overflow-y: auto; }
      html, body { margin: 0; padding: 0; }
      body {
        background: #7d8083;
        font-family: Calibri, "Segoe UI", system-ui, sans-serif;
        color: #1a1a1a;
        font-size: 16px;
      }
      .appbar {
        position: sticky; top: 0; z-index: 20;
        display: flex; align-items: center; gap: 16px;
        padding: 10px 18px;
        background: #23262a; color: #f2f2f2;
        font-size: 13px;
        box-shadow: 0 1px 6px rgba(0,0,0,.4);
      }
      .appbar .brand { font-weight: 700; letter-spacing: .2px; }
      .appbar .pkg { color: #8fb8ff; }
      .appbar .note { color: #b9c0c8; }
      .appbar .spacer { flex: 1; }
      .appbar input[type=file] { font-size: 12px; }
      .status { font-variant-numeric: tabular-nums; color: #b9c0c8; }
      .status-ok { color: #9fe08a; }
      .status-err { color: #ff9a8a; }
      .probe-bar {
        display: flex; align-items: center; gap: 10px;
        padding: 6px 18px; background: #2f3338; color: #d7dde4;
        border-top: 1px solid #3c4248; font-size: 12px;
      }
      .probe-label { font-weight: 700; color: #ffcf6b; letter-spacing: .2px; }
      #input-probe {
        min-width: 180px; min-height: 22px; padding: 2px 8px;
        background: #fff; color: #111; border: 1px solid #8f979f; border-radius: 3px;
        font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.4;
      }
      #input-probe:focus { outline: 2px solid #8fb8ff; }
      .probe-note { color: #aab3bc; }
      .probe-note code { color: #d7dde4; }
      .out { padding: 26px 0 60px; }
      .sheets { display: flex; flex-direction: column; align-items: center; gap: 26px; }
      .sheet { display: flex; align-items: stretch; position: relative; margin-bottom: 34px; }
      .sheet-label {
        position: absolute; bottom: -22px; left: 0;
        font-size: 11px; color: #e8e8e8;
        background: rgba(0,0,0,.35); padding: 2px 8px; border-radius: 3px;
      }
      .page {
        position: relative; display: flex; flex-direction: column;
        background: #fff; box-shadow: 0 3px 14px rgba(0,0,0,.45);
      }
      .page-content { flex: 1; }
      .page-content.landscape { background: #fff; }
      .page-content.page-bordered { border: 1px solid #000; }
      .page-content.cols { column-count: 2; column-gap: 48px; }
      .hf { font-size: 15px; }
      .hf.header { min-height: 24px; margin-bottom: 24px; }
      .hf.footer { min-height: 24px; margin-top: 24px; }
      .hf.empty { display: none; }
      .hf .para { margin: 0 0 2px; }
      .gutter {
        width: 230px; flex: 0 0 230px;
        background: #f0f0f0; border-left: 1px solid #d8d8d8;
        padding: 6px;
      }
      .para { margin: 0 0 6px; line-height: 1.25; }
      .para.heading { font-size: 21px; font-weight: 700; color: #2f5496; margin: 10px 0 2px; }
      .para[data-style="ListParagraph"] { margin-left: 36px; }
      .run { white-space: pre-wrap; }
      .pmark { display: inline-block; width: 0; }
      .tab { display: inline-block; min-width: 48px; }
      .soft-hyphen { color: #bbb; }
      .break-mark {
        display: inline-block; margin: 0 6px; padding: 0 6px;
        font-size: 10px; color: #b26a00; border: 1px dashed #d8a44a;
        border-radius: 3px; background: #fff6e6; vertical-align: middle;
      }
      .mark.bookmark { color: #2f5496; font-size: 11px; }
      .symbol { font-size: 14px; }
      .field { background: #f2f2f2; }
      .rev.ins { color: #c00; text-decoration: underline; }
      .rev.del { color: #c00; text-decoration: line-through; }
      .rev.movfrom { color: #0a7a3d; text-decoration: line-through; }
      .rev.moveto { color: #0a7a3d; text-decoration: underline; }
      .format-revision { background: #fff2b8; }
      .has-revision { border-left: 2px solid #c00; padding-left: 6px; margin-left: -8px; }
      .note-ref { color: #2f5496; font-size: 11px; vertical-align: super; }
      .comment-ref { color: #c00; font-size: 10px; vertical-align: super; cursor: pointer; }
      .obj { margin: 10px 0; }
      .obj-cap { font-size: 10px; color: #777; margin-top: 3px; font-family: ui-monospace, Menlo, monospace; }
      .picture { max-width: 100%; image-rendering: pixelated; border: 1px solid #e0e0e0; }
      .ole-icon { image-rendering: pixelated; border: 1px solid #cfcfcf; }
      .textbox { border: 1.5px solid #444; padding: 4px 8px; display: inline-block; background: #fff; }
      .textbox-inner { font-size: 15px; }
      .smartart-band {
        border: 1px dashed #bbb; background: #fafafa;
        display: flex; align-items: center; justify-content: center;
      }
      .math { font-style: italic; font-size: 20px; text-align: center; margin: 14px 0; }
      .tbl-wrap { margin: 10px 0; }
      .doc-table { border-collapse: collapse; }
      .doc-table td, .doc-table th {
        border: 1px solid #000; padding: 3px 6px; vertical-align: top;
        font-size: 15px; text-align: left;
      }
      .doc-table th { font-weight: 700; }
      .sdt { border: 1px dotted #7a7ad0; padding: 2px 6px; margin: 4px 0; display: inline-block; }
      .sdt-tag { font-size: 10px; color: #5a5ac0; font-family: ui-monospace, Menlo, monospace; }
      .altchunk { border-left: 3px solid #8ab; padding-left: 8px; margin: 8px 0; }
      .altchunk-body p { margin: 4px 0; }
      .notes { margin-top: 18px; font-size: 13px; }
      .notes-rule { width: 180px; border-top: 1px solid #000; margin-bottom: 4px; }
      .note-line { margin: 2px 0; }
      .balloons { max-width: 700px; margin: 18px auto 0; }
      .balloons-title { font-size: 12px; color: #eee; margin-bottom: 6px; }
      .balloon {
        background: #fff; border: 1px solid #c9c9c9; border-radius: 6px;
        padding: 6px 9px; font-size: 12px; margin-bottom: 8px;
      }
      .balloon-head { font-weight: 700; color: #c00; }
      .err { color: #fff; background: #7a1f1f; padding: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="appbar">
      <span class="brand">office-open</span>
      <span class="pkg">@office-open/docx · parseDocument()</span>
      <span class="note">headless OOXML library — no layout engine; document rendered from the parsed model</span>
      <span class="spacer"></span>
      <input id="corpus-file" type="file" accept=".docx" />
      <span class="status" id="status">loading…</span>
    </div>
    <div class="probe-bar">
      <span class="probe-label">input probe</span>
      <div
        id="input-probe"
        contenteditable="true"
        spellcheck="false"
        role="textbox"
        aria-label="host input probe"
      ></div>
      <span class="probe-note">
        host <code>contenteditable</code> — office-open has no editing surface; typing
        here does not touch the parsed model, so it is not a C05/C06 input pipeline
      </span>
    </div>
    <div class="out" id="out"></div>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
