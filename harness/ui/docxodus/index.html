<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Docxodus — rendering study host</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font: 13px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f4f4f5;
        color: #18181b;
      }
      header {
        display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
        padding: 10px 16px; background: #fff; border-bottom: 1px solid #d4d4d8;
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 650; }
      header .sp { flex: 1; }
      #status { font-variant-numeric: tabular-nums; color: #52525b; }
      #status.err { color: #b91c1c; }
      main { padding: 16px; }
      .doc-label { font-size: 11px; color: #71717a; margin: 0 0 8px; }
      #pages { background: #fff; }
      #editorHost { background: #fff; }
      .hidden { display: none !important; }
      button, .btn {
        font: inherit; padding: 4px 10px; border: 1px solid #d4d4d8;
        background: #fff; border-radius: 6px; cursor: pointer;
      }
      button:disabled { opacity: .5; cursor: default; }
      input[type=file] { font: inherit; }
    </style>
  </head>
  <body>
    <header>
      <h1>Docxodus</h1>
      <label class="btn">
        Open a .docx
        <input id="file" type="file" accept=".docx" hidden />
      </label>
      <button id="modeRender" type="button">Paginated render</button>
      <button id="modeEditor" type="button">Block editor</button>
      <span class="sp"></span>
      <span id="status">starting…</span>
    </header>
    <main>
      <p class="doc-label" id="docLabel"></p>
      <div id="pages"></div>
      <div id="editorHost" class="hidden"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
